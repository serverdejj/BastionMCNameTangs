# Colores con &; los prefijos de LuckPerms tambien admiten &.
nametag:
  enabled: true
  clan: '&7Sin clan'
  rank-fallback: '&7[Jugador]'
  line-one: '%prefix% &f%player%'
  line-two: '&c❤ %health%/%max_health%'
  line-three: '%clan%'
  background: false
  shadow: true
# Primera persona: no existe una forma fiable desde el servidor de mostrar
# un holograma sobre tu propia cabeza en la camara normal de primera persona.
# Como alternativa, muestra tu informacion en la barra de accion.
self-actionbar:
  enabled: true
  text: '%prefix% &f%player% &8| &c❤ %health%/%max_health% &8| %clan%'
update-ticks: 10
