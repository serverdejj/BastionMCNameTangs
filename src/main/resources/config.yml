# Colores con &; los prefijos de LuckPerms tambien admiten &.
nametag:
  enabled: true
  clan: '&7Sin clan'
  rank-fallback: '&7[Jugador]'
  line-one: '%prefix% &f%player%'
  line-two: '%clan% &8| &aDinero: &f$%money%'
  line-three: '&c❤ %health%/%max_health%'
  background: false
  hide-vanilla: true
  # Posicion inicial antes de montar; no controla la altura del pasajero.
  height-offset: 0.25
  # Ajuste vertical cuando el holograma va montado como pasajero.
  passenger-height-offset: -1.35
  shadow: true
# Primera persona: no existe una forma fiable desde el servidor de mostrar
# un holograma sobre tu propia cabeza en la camara normal de primera persona.
# Como alternativa, muestra tu informacion en la barra de accion.
self-actionbar:
  enabled: true
  text: '%prefix% &f%player% &8| &c❤ %health%/%max_health% &8| %clan%'
# Si Vault no tiene una economia conectada, se mostrara este texto:
economy:
  unavailable: 'N/D'
update-ticks: 1

# Etiqueta especial al entrar a una mazmorra iniciada con /dungeon go.
dungeon:
  line-one: '%prefix% &f%player%'
  line-two: '&c❤ %health%/%max_health%'
  line-three: '&6⚔ ESTÁS EN DUNGEON'
